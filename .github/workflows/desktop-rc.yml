name: desktop-rc

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-rc-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-rc:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/')
    runs-on: macos-15
    env:
      CI: "true"
      RC_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Select Xcode 26.2 and verify macOS SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          test "$(xcrun --sdk macosx --show-sdk-version)" = "26.2"
      - name: Remap macOS release build paths
        run: >-
          echo "RUSTFLAGS=--remap-path-prefix=$HOME=BUILD_HOME
          --remap-path-prefix=$GITHUB_WORKSPACE=BUILD_WORKSPACE
          -C link-arg=-Wl,-S
          -C link-arg=-Wl,-x" >> "$GITHUB_ENV"
      - name: Verify Apple Silicon runner
        run: >-
          python -c "import subprocess; value=subprocess.check_output(['rustc','--print','host-tuple'], text=True).strip(); assert value == 'aarch64-apple-darwin', value; print('MACOS_ARM64_RUNNER=PASS')"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './python[test,build]'
      - run: pnpm install --frozen-lockfile
      - name: Run RC verifier contracts
        run: >-
          python -m pytest -q
          python/tests/regression/test_built_sidecar_verifier.py
          python/tests/regression/test_rc_bundle_verifier.py
          python/tests/regression/test_macos_user_launch_smoke.py
          python/tests/regression/test_rc_packaging_workflow.py
          python/tests/regression/test_reproducible_build_config.py
      - run: python scripts/verify_desktop.py
      - run: python scripts/build_sidecar.py
      - run: >-
          python scripts/verify_built_sidecar.py
          --binary apps/desktop/src-tauri/binaries/qian-sidecar-aarch64-apple-darwin
      - run: pnpm --dir apps/desktop test -- --run
      - run: pnpm --dir apps/desktop lint
      - run: pnpm --dir apps/desktop typecheck
      - run: pnpm --dir apps/desktop build
      - run: cd apps/desktop/src-tauri && cargo test --locked
      - run: cd apps/desktop/src-tauri && cargo check --locked
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      - name: Build ad-hoc signed macOS application and DMG
        run: pnpm --dir apps/desktop tauri build --bundles app,dmg --ci -- --locked
      - run: git diff --exit-code -- apps/desktop/src-tauri/Cargo.lock
      - name: Locate exact macOS outputs
        run: |
          shopt -s nullglob
          apps=(apps/desktop/src-tauri/target/release/bundle/macos/*.app)
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#dmgs[@]}" -eq 1
          echo "QIAN_APP_BUNDLE=${apps[0]}" >> "$GITHUB_ENV"
          echo "QIAN_DMG=${dmgs[0]}" >> "$GITHUB_ENV"
      - name: Mount the generated DMG read-only
        run: |
          mkdir -p "$RUNNER_TEMP/qian-rc-dmg"
          hdiutil attach "$QIAN_DMG" -mountpoint "$RUNNER_TEMP/qian-rc-dmg" -nobrowse -readonly
          shopt -s nullglob
          apps=("$RUNNER_TEMP"/qian-rc-dmg/*.app)
          test "${#apps[@]}" -eq 1
          echo "QIAN_MOUNTED_APP=${apps[0]}" >> "$GITHUB_ENV"
      - name: Verify original and DMG application payloads
        run: >-
          python scripts/verify_rc_bundle.py
          --platform macos
          --payload "$QIAN_APP_BUNDLE"
          --payload "$QIAN_MOUNTED_APP"
          --source-config apps/desktop/src-tauri/tauri.conf.json
          --expected-commit "$RC_COMMIT"
      - name: Smoke-test the application from the mounted DMG
        run: |
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$QIAN_MOUNTED_APP/Contents/Info.plist")"
          python scripts/smoke_packaged_app.py --app-binary "$QIAN_MOUNTED_APP/Contents/MacOS/$executable_name"
      - name: Verify normal macOS user launch from the mounted DMG
        run: python scripts/smoke_macos_user_launch.py --app "$QIAN_MOUNTED_APP"
      - name: Verify abnormal-exit sidecar cleanup from the mounted DMG
        run: |
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$QIAN_MOUNTED_APP/Contents/Info.plist")"
          python scripts/smoke_packaged_app.py --abnormal-lifecycle --app-binary "$QIAN_MOUNTED_APP/Contents/MacOS/$executable_name"
      - name: Detach the generated DMG
        if: always()
        run: hdiutil detach "$RUNNER_TEMP/qian-rc-dmg" || true
      - name: Stage macOS RC artifacts
        run: >-
          python scripts/stage_rc_artifacts.py macos
          --app "$QIAN_APP_BUNDLE"
          --dmg "$QIAN_DMG"
          --output-dir rc-stage
      - name: Create macOS build manifest and checksums
        run: >-
          python scripts/rc_manifest.py create-platform
          --platform macos
          --architecture arm64
          --artifact rc-stage/qian-labor-desktop-0.1.0-rc.1-macos-arm64-unsigned.app.tar.gz
          --artifact rc-stage/qian-labor-desktop-0.1.0-rc.1-macos-arm64-unsigned.dmg
          --built-sidecar-smoke PASS
          --packaged-app-smoke PASS
          --abnormal-lifecycle-smoke PASS
          --output rc-stage/PLATFORM-MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: qian-labor-desktop-0.1.0-rc.1-macos-arm64-unsigned
          path: rc-stage
          if-no-files-found: error
          retention-days: 14

  rc-manifest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/')
    needs:
      - macos-arm64-rc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: qian-labor-desktop-0.1.0-rc.1-macos-arm64-unsigned
          path: downloads/macos
      - name: Independently rehash the macOS artifacts
        run: >-
          python scripts/rc_manifest.py combine
          --manifest downloads/macos/PLATFORM-MANIFEST.json
          --artifact-root downloads
          --output-dir rc-final
      - name: Verify final RC manifest and checksum file
        run: >-
          python scripts/rc_manifest.py verify
          --manifest rc-final/BUILD-MANIFEST.json
          --artifact-root rc-final
      - name: Verify exact final deliverables
        run: |
          test -f rc-final/qian-labor-desktop-0.1.0-rc.1-macos-arm64-unsigned.app.tar.gz
          test -f rc-final/qian-labor-desktop-0.1.0-rc.1-macos-arm64-unsigned.dmg
          test -f rc-final/BUILD-MANIFEST.json
          test -f rc-final/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qian-labor-desktop-0.1.0-rc.1-unsigned
          path: rc-final
          if-no-files-found: error
          retention-days: 14
