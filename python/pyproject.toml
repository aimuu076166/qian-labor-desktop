[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qian-labor-desktop-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "uvicorn>=0.41,<1",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]
build = [
  "pyinstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qian_labor = ["rules/catalog/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
